
<style>
.app {
    max-width: 1430px;
}
.calculator-workspace {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 22px;
    align-items: start;
}
.percent-panel [hidden] {
    display: none !important;
}
.percent-panel .field {
    margin-top: 14px;
}
.percent-panel .bd-entry {
    max-width: none;
}
.percent-panel select {
    flex: 0 0 68px;
}
#pd-precise {
    display: block;
    margin-top: 8px;
    overflow-wrap: anywhere;
}
#pd-comparison {
    margin-top: 8px;
}
@media (max-width: 1150px) {
    .calculator-workspace {
        grid-template-columns: 1fr;
    }
    .app {
        max-width: 1050px;
    }
}
</style>

<script>
(() => {
    'use strict';

    const panels = document.querySelectorAll('.main.linked');
    if (!panels.length) return;

    const workspace = document.createElement('div');
    workspace.className = 'calculator-workspace';

    const existing = document.createElement('div');

    panels[0].before(workspace);
    workspace.appendChild(existing);

    panels.forEach(panel => existing.appendChild(panel));

    const panel = document.createElement('section');
    panel.className = 'panel percent-panel';

    panel.innerHTML = `
        <h2>3. Percentage difference — 2(f)</h2>

        <div class="equation">
            <span class="fraction">
                <span class="top">|k₁ − k₂|</span>
                <span class="bottom">½(k₁ + k₂)</span>
            </span>
            × 100
        </div>

        <div class="field">
            <label for="pd-k1">k₁</label>
            <div class="bd-entry">
                <input id="pd-k1"
                       type="number"
                       min="0"
                       step="any"
                       placeholder="0.0188">
                <span class="power"
                      id="pd-label1"
                      hidden>× 10^</span>
                <select id="pd-exp1" hidden></select>
            </div>
        </div>

        <div class="field">
            <label for="pd-k2">k₂</label>
            <div class="bd-entry">
                <input id="pd-k2"
                       type="number"
                       min="0"
                       step="any"
                       placeholder="0.0247">
                <span class="power"
                      id="pd-label2"
                      hidden>× 10^</span>
                <select id="pd-exp2" hidden></select>
            </div>
        </div>

        <button type="button"
                class="bd-toggle"
                id="pd-toggle">
            Use standard form (press Q)
        </button>

        <div class="answer" aria-live="polite">
            <span class="hint">
                Percentage difference (2 significant figures)
            </span>

            <strong id="pd-answer">—</strong>

            <span class="hint" id="pd-precise">
                Enter both k values.
            </span>

            <div class="warning" id="pd-comparison"></div>
        </div>

        <button type="button"
                class="clear-button"
                id="pd-clear">
            Clear Values
        </button>
    `;

    workspace.appendChild(panel);

    const $ = id => document.getElementById(id);
    let standard = false;

    for (const i of [1, 2]) {
        for (let e = -12; e <= 12; e++) {
            const option = document.createElement('option');
            option.value = e;
            option.textContent = e > 0 ? '+' + e : e;
            $('pd-exp' + i).appendChild(option);
        }

        $('pd-exp' + i).value = '-2';
    }

    function getValue(i) {
        const input = $('pd-k' + i).value;

        if (input.trim() === '') return NaN;

        return Number(input) *
            (standard
                ? 10 ** Number($('pd-exp' + i).value)
                : 1);
    }

    function formatSF(value, sf) {
        const result = value.toPrecision(sf);

        if (!result.includes('e')) return result;

        if (value === 0) return '0.0';

        const decimals =
            Math.max(0, sf - 1 -
                Math.floor(Math.log10(Math.abs(value))));

        return decimals <= 12
            ? value.toFixed(decimals)
            : result;
    }

    function update() {
        const k1 = getValue(1);
        const k2 = getValue(2);

        if (!Number.isFinite(k1) ||
            !Number.isFinite(k2) ||
            k1 < 0 ||
            k2 < 0 ||
            k1 + k2 === 0) {

            $('pd-answer').textContent = '—';
            $('pd-precise').textContent =
                'Enter both k values.';
            $('pd-comparison').textContent = '';
            return;
        }

        const percentage =
            Math.abs(k1 - k2) /
            ((k1 + k2) / 2) * 100;

        $('pd-answer').textContent =
            formatSF(percentage, 2) + '%';

        $('pd-precise').textContent =
            'Unrounded: ' +
            Number(percentage.toPrecision(12)) + '%';

        const comparison = $('pd-comparison');

        if (Math.abs(percentage - 15) < 1e-10) {
            comparison.textContent =
                'Equal to 15% — at threshold';
            comparison.style.color = '#ffd08c';
        } else if (percentage > 15) {
            comparison.textContent =
                'Above 15% — relationship not supported';
            comparison.style.color = '#ff9ca8';
        } else {
            comparison.textContent =
                'Below 15% — relationship supported';
            comparison.style.color = '#9de5b4';
        }
    }

    function toggleFormat() {
        const values = [getValue(1), getValue(2)];

        standard = !standard;

        for (const i of [1, 2]) {
            const value = values[i - 1];

            $('pd-label' + i).hidden = !standard;
            $('pd-exp' + i).hidden = !standard;

            $('pd-k' + i).placeholder =
                standard ? '1.88' : '0.0188';

            if (!Number.isFinite(value)) continue;

            if (standard) {
                const exponent = value === 0
                    ? 0
                    : Math.max(-12, Math.min(12,
                        Math.floor(
                            Math.log10(Math.abs(value))
                        )
                    ));

                $('pd-exp' + i).value = exponent;

                $('pd-k' + i).value =
                    Number(
                        (value / 10 ** exponent)
                            .toPrecision(12)
                    );
            } else {
                $('pd-k' + i).value =
                    Number(value.toPrecision(12));
            }
        }

        $('pd-toggle').textContent = standard
            ? 'Use ordinary numbers (press Q)'
            : 'Use standard form (press Q)';

        update();
    }

    function clearPercentage() {
        $('pd-k1').value = '';
        $('pd-k2').value = '';
        update();
    }

    for (const i of [1, 2]) {
        $('pd-k' + i).addEventListener('input', update);
        $('pd-exp' + i).addEventListener('change', update);

        $('pd-exp' + i).addEventListener(
            'wheel',
            event => {
                if (event.ctrlKey || event.deltaY === 0)
                    return;

                event.preventDefault();

                const el = $('pd-exp' + i);

                el.selectedIndex = Math.max(
                    0,
                    Math.min(
                        el.options.length - 1,
                        el.selectedIndex +
                            (event.deltaY < 0 ? 1 : -1)
                    )
                );

                update();
            },
            { passive: false }
        );
    }

    $('pd-toggle').addEventListener('click', toggleFormat);

    $('pd-clear').addEventListener('click', () => {
        clearPercentage();
        $('pd-k1').focus();
    });

    document.addEventListener('keydown', event => {
        if (event.ctrlKey ||
            event.altKey ||
            event.metaKey ||
            event.repeat) return;

        if (event.key.toLowerCase() === 'q') {
            event.preventDefault();
            toggleFormat();
        }

        if (event.key.toLowerCase() === 'c') {
            clearPercentage();
        }
    });

    for (const id of ['clear-all', 'clear-all-bottom']) {
        $(id)?.addEventListener('click', clearPercentage);
    }

    document.title =
        '9702 Physics - K Calculator Tool for 2(e) and 2(f)';

    const heading = document.querySelector('h1');

    if (heading) {
        heading.textContent = document.title;
    }

    update();
})();
</script>
